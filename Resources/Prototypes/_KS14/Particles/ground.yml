# What wheels, tracks and running feet throw up from the ground. Fed only by KsGroundEffectSystem (see the ksGroundEffect
#   prototypes in _KS14/GroundEffect/ground_effects.yml), which places each particle where a contact point rolled and
#   gives it part of the contact's velocity, backwards; these spread it. World space, so a wake stays on the ground
#   behind whatever made it. Drawn on the floor layer: above tiles and puddles, under the hull and every mob. Lit, so
#   dark at night but in headlights.

- type: ksParticles
  abstract: true
  id: KsGroundDustBase
  space: World
  layer: Floor
  # Culling box about the emitter, which rides its entity: the tank is 2.7 x 3.8.
  size: 6, 6
  count: 160
  spawning: 0
  lifespan: { kind: num, a: 0.6, b: 1 }
  fade: 0.5
  fadeIn: 0.05
  position: { kind: circle, a: 0, b: 0.15 }
  velocity: { kind: circle, a: 0.2, b: 0.8 }
  friction: 0.95
  scale: { kind: num, a: 0.5, b: 0.8 }
  grow: 0.6
  rotation: { kind: num, a: 0, b: 360 }
  spin: { kind: num, a: -90, b: 90 }
  # Soft greyscale puffs, bright in the middle with a grey rim, tinted by each effect's colour.
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/ground_puff.rsi
      state: puff_1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/ground_puff.rsi
      state: puff_2
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/ground_puff.rsi
      state: puff_3

- type: ksParticles
  parent: KsGroundDustBase
  id: KsGroundDustSnow
  lifespan: { kind: num, a: 0.8, b: 1.3 }
  fade: 0.7
  color: "#E4ECF8E0"
  scale: { kind: num, a: 0.55, b: 0.9 }
  velocity: { kind: circle, a: 0.3, b: 1.1 }

- type: ksParticles
  parent: KsGroundDustBase
  id: KsGroundDustSand
  color: "#EEE2BEE0"
  velocity: { kind: circle, a: 0.3, b: 1 }

- type: ksParticles
  parent: KsGroundDustSand
  id: KsGroundDustSandRed
  color: "#CC8C70E0"

- type: ksParticles
  parent: KsGroundDustBase
  id: KsGroundDustDirt
  color: "#9C8466C0"
  scale: { kind: num, a: 0.45, b: 0.7 }
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/ground_puff.rsi
      state: puff_1
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/ground_puff.rsi
      state: puff_2
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/impact_debris.rsi
      state: rock
    weight: 0.3

# Torn-up leaves and clippings, little dust; they fall back quickly.
- type: ksParticles
  parent: KsGroundDustBase
  id: KsGroundDustGrass
  lifespan: { kind: num, a: 0.35, b: 0.6 }
  fade: 0.25
  grow: 0
  color: "#9CC870"
  scale: { kind: num, a: 1.2, b: 1.8 }
  velocity: { kind: circle, a: 0.4, b: 1.2 }
  spin: { kind: num, a: -360, b: 360 }
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/impact_debris.rsi
      state: leaf

# Droplets thrown out of a puddle, white so the puddle's own colour tints them.
- type: ksParticles
  parent: KsGroundDustBase
  id: KsGroundSplash
  lifespan: { kind: num, a: 0.3, b: 0.55 }
  fade: 0.25
  grow: 0
  color: "#FFFFFFE8"
  # The dot is two pixels of a 32 px frame: this makes drops of four to six.
  scale: { kind: num, a: 2, b: 3 }
  velocity: { kind: circle, a: 0.8, b: 1.8 }
  friction: 0.9
  spin: 0
  rotation: 0
  sprites:
  - sprite:
      sprite: /Textures/_KS14/Effects/Particles/generic.rsi
      state: dot
