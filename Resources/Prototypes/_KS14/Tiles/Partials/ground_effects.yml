# What each natural tile throws up under wheels, tracks and running feet (KsGroundEffectSystem). Every tile is listed
#   by id, children of a listed parent included, so nothing hangs on partials reaching children.

# Snow
- type: !PartialOnly tile
  id: FloorSnow
  ksGroundEffect: KsGroundEffectSnow

- type: !PartialOnly tile
  id: FloorSnowDug
  ksGroundEffect: KsGroundEffectSnow

- type: !PartialOnly tile
  id: PlatingSnow
  ksGroundEffect: KsGroundEffectSnow

- type: !PartialOnly tile
  id: FloorAstroSnow
  ksGroundEffect: KsGroundEffectSnow

