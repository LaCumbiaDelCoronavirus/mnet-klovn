# Fluidmos properties for reagents carried in pipes. Linked reagents' vapor is their atmos gas (molar mass from the gas);
#     vaporizationEntropy is the real ΔH_vap / (R Tb), which shapes the vapor-pressure curve.

- type: !PartialOnly reagent
  id: Water
  fluidmos:
    gas: WaterVapor
    vaporizationEntropy: 13.1

- type: !PartialOnly reagent
  id: Oxygen
  fluidmos:
    gas: Oxygen
    vaporizationEntropy: 9.1

- type: !PartialOnly reagent
  id: Nitrogen
  fluidmos:
    gas: Nitrogen
    vaporizationEntropy: 8.7

- type: !PartialOnly reagent
  id: NitrousOxide
  fluidmos:
    gas: NitrousOxide
    vaporizationEntropy: 10.7

- type: !PartialOnly reagent
  id: Ethanol
  fluidmos:
    molarMass: 46
    vaporizationEntropy: 13.2

# A strong candidate for a WaterVapor-style link to the Ammonia gas, pending the maintainer's sign-off.
- type: !PartialOnly reagent
  id: Ammonia
  fluidmos:
    molarMass: 17
    vaporizationEntropy: 11.7
