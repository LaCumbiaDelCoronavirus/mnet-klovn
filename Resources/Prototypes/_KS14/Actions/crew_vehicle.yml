- type: entity
  parent: BaseAction
  id: KsCrewVehicleActionHorn
  name: Sound horn
  description: Sound the vehicle's horn.
  components:
  - type: Action
    useDelay: 2
    icon: { sprite: Objects/Fun/bikehorn.rsi, state: icon }
  - type: InstantAction
    event: !type:KsCrewVehicleHornActionEvent

# Starts or stops the engine; on while it runs, and its cooldown is the start delay.
- type: entity
  parent: BaseAction
  id: KsCrewVehicleActionEngine
  name: Engine
  description: Start or stop the vehicle's engine.
  components:
  - type: Action
    icon: { sprite: Interface/Actions/actions_mecha.rsi, state: mech_cycle_equip_off }
    iconOn: { sprite: Interface/Actions/actions_mecha.rsi, state: mech_cycle_equip_on }
  - type: InstantAction
    event: !type:KsCrewVehicleEngineActionEvent

# One per weapon of a gunner seat that has several. Its own icon: the rounds of its weapon are drawn on it
#   (KsCrewVehicleGunnerHudSystem), by the stock counter the alerts use.
- type: entity
  parent: BaseAction
  id: KsCrewVehicleActionSelectWeapon
  name: Select weapon
  description: Fire this weapon.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:KsCrewVehicleSelectWeaponActionEvent
  - type: KsCrewVehicleSelectWeaponAction
  - type: GenericCounterAlert
    hideLeadingZeroes: true
  - type: Sprite
    layers:
    - sprite: /Textures/Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi
      state: base
    - map: [ "1" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      state: "0"
    - map: [ "10" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      state: "0"
    - map: [ "100" ]
      sprite: /Textures/Interface/Alerts/essence_counter.rsi
      state: "0"
