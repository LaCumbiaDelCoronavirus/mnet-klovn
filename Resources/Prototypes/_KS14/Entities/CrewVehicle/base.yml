# Parents for everything placed in a crew vehicle's interior map. None of them has Damageable, Destructible,
# Construction, Anchorable or Pullable: an interior cannot be damaged, taken apart, unbolted or dragged around.

- type: entity
  abstract: true
  id: KsCrewVehicleInteriorBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: KsCrewVehicleInteriorPart

# A wall piece that stops people. It does not block sight: the cabin's outline does that with occluder pieces
#   (KsCrewVehicleInteriorBaseOccluder), which can sit off the tile grid and leave gaps exactly where the art has glass.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseWall
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer

# A wall piece that does not block sight: the outside drawn behind the interior shows through it.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseWindow
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer

# One run of a cabin's sight-blocking outline, with nothing to see, touch or bump into. Each placed piece gives its
#   Occluder a polygon in the map file. Pieces overlap a little at the corners rather than meet edge to edge, as two
#   unanchored pieces' positions can miss the exact shared-edge test and leave a slit.
- type: entity
  abstract: true
  id: KsCrewVehicleInteriorBaseOccluder
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Occluder
  - type: KsCrewVehicleInteriorPart

# A door out of the interior. Someone getting in arrives standing on it, so it does not block movement. Each placed
#   door names its doorway in the map file.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseExit
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer:
        - MidImpassable
  - type: InteractionOutline
  - type: KsCrewVehicleExit

# A console through which a mounted weapon is loaded from inside. Each placed port names its mount in the map file, or a
#   child prototype names it.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseAmmoPort
  components:
  - type: KsCrewVehicleAmmoPort

# A seat inside a crew vehicle. Not anchored, so it can sit where the interior's art has it rather than at a tile's
#   centre, and not solid: people step over it to sit down.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseSeat
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        layer:
        - MidImpassable
  - type: Strap
    position: Stand

# Art of an interior that is only drawn: the floor plan under everything else, which nobody touches. Not anchored, so it
#   can sit off the tile grid where the art needs it.
- type: entity
  abstract: true
  id: KsCrewVehicleInteriorBaseDecoration
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    drawdepth: FloorTiles
  - type: KsCrewVehicleInteriorPart

# A light fixed inside an interior, with nothing to see or touch: the cabin's ceiling light, always on. Not anchored, so
#   it can sit off the tile grid over the middle of the cabin.
- type: entity
  abstract: true
  id: KsCrewVehicleInteriorBaseLight
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: PointLight
  - type: KsCrewVehicleInteriorPart

# The hull of a crew vehicle, driven from the driver seat in its interior. Children give it a sprite, its body and
#   contact fixtures, speeds, an interior and health. Parked it is a loose Dynamic body, solid to mobs and to driven
#   vehicles; driven it is a kinematic controller (VehicleSystem.Klovn.BodyType.cs). It can't be thrown, nor pulled unless a
#   child makes it Pullable (an engine then allows it only while off and nobody drives).
#   Children's fixtures: `fix1`, the hard body, mask MobMask, layers MidImpassable, BulletImpassable and
#   Opaque (lasers hit it; a weapon mounted on the hull passes it all the same) but never Impassable or HighImpassable,
#   the layers items collide with, so casings and dropped things neither stop nor push it; `contact`, non-hard and a
#   little larger, mask MobMask and MobLayer, which finds the mobs and hulls it touches (KsCrewVehicleDrive.contactFixture,
#   KsCrewVehicleRunOver.fixture).
- type: entity
  abstract: true
  id: KsCrewVehicleHullBase
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: InputMover
  - type: MovementSpeedModifier
  - type: NoRotateOnMove
  - type: Vehicle
    requiresHands: false
    transferDamage: false
  # Weightless exactly where there is no floor under it, over space or lattice (KsCrewVehicleDriveSystem): there it has
  #   no traction, can't be driven or steered, and drifts with the speed it had, like any loose body.
  - type: GravityAffected
  - type: KsCrewVehicleDrive
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: ActionsContainer
  # Written out, so that a hull made on an uninitialised map saves as it was spawned.
  - type: ContainerContainer
    containers:
      actions: !type:Container
  - type: KsCrewVehicleHorn
    sound:
      path: /Audio/Effects/Vehicle/carhorn.ogg
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 8
    energy: 2
  - type: KsCrewVehicleHeadlight
  - type: KsCrewVehicleRunOver
    damage:
      types:
        Blunt: 25
  - type: KsCrewVehiclePush
    shoveSound:
      collection: MetalThud
    shoveVehicleSound:
      path: /Audio/Effects/metal_slam1.ogg
  # Everything hard that isn't loose takes smashDamage: it breaks and the hull drives on slower, or it stands and the
  #   hull crashes into it (a sturdy thing takes several hits). Walls are crashed into at once. A door that would open
  #   for the hull opens.
  - type: KsCrewVehicleSmash
    walls:
      tags:
      - Wall
    smashDamage:
      types:
        Blunt: 150
    smashSelfDamage:
      types:
        Blunt: 5
    wallDamage:
      types:
        Blunt: 30
    wallSelfDamage:
      types:
        Blunt: 20
    smashSound:
      collection: WindowShatter
    crashSound:
      collection: MetalSlam
    smashEffect: EffectSparks
    crashEffect: EffectSparks
  - type: KsCrewVehicleCrashLockout
    stallSound:
      path: /Audio/Effects/metal_crunch.ogg
  # On its driver's side while they drive it and are fit to, which is when NPCs fight it, and before most else in sight,
  #   as they would a turret. Nobody's otherwise.
  - type: KsVehicleOperatorFactions
  - type: KsNpcTargetPriority
    priority: 0.8
