# Parents for everything placed in a crew vehicle's interior map. None of them has Damageable, Destructible,
# Construction, Anchorable or Pullable: an interior cannot be damaged, taken apart, unbolted or dragged around.

- type: entity
  abstract: true
  id: KsCrewVehicleInteriorBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: KsCrewVehicleInteriorPart

- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseWall
  components:
  - type: Occluder
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - WallLayer

# A wall piece that does not block sight: the outside drawn behind the interior shows through it.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseWindow
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer

# A door out of the interior. Someone getting in arrives standing on it, so it does not block movement. Each placed
#   door names its doorway in the map file.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseExit
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer:
        - MidImpassable
  - type: InteractionOutline
  - type: KsCrewVehicleExit

# A console through which a mounted weapon is loaded from inside. Each placed port names its mount in the map file, or a
#   child prototype names it.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseAmmoPort
  components:
  - type: KsCrewVehicleAmmoPort

# A seat inside a crew vehicle. Not anchored, so it can sit where the interior's art has it rather than at a tile's
#   centre, and not solid: people step over it to sit down.
- type: entity
  abstract: true
  parent: KsCrewVehicleInteriorBase
  id: KsCrewVehicleInteriorBaseSeat
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        layer:
        - MidImpassable
  - type: Strap
    position: Stand

# Art of an interior that is only drawn: the floor plan under everything else, which nobody touches. Not anchored, so it
#   can sit off the tile grid where the art needs it.
- type: entity
  abstract: true
  id: KsCrewVehicleInteriorBaseDecoration
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    drawdepth: FloorTiles
  - type: KsCrewVehicleInteriorPart

# The hull of a crew vehicle, driven from the driver seat in its interior. Children give it a sprite, its body and
#   contact fixtures, speeds, an interior and health. Parked it is a loose Dynamic body, solid to mobs and to driven
#   vehicles; driven it is a kinematic controller (VehicleSystem.Klovn.BodyType.cs). It can't be pulled or thrown.
#   Children's fixtures: `fix1`, the hard body, mask MobMask, its layers including Opaque, which lasers hit (a weapon
#   mounted on the hull passes it all the same); `contact`, non-hard and a little larger, mask MobMask
#   and MobLayer, with which a driven hull stops against another (KsCrewVehicleDrive.contactFixture) and finds the
#   mobs it runs over or is stopped by (KsCrewVehicleRunOver.fixture).
- type: entity
  abstract: true
  id: KsCrewVehicleHullBase
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: InputMover
  - type: MovementSpeedModifier
  - type: NoRotateOnMove
  - type: Vehicle
    requiresHands: false
    transferDamage: false
  - type: KsCrewVehicleDrive
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: AmbientSound
    enabled: false
    volume: -4
    range: 8
    sound:
      path: /Audio/Effects/Vehicle/vehicleengineidle.ogg
  - type: ActionsContainer
  # Written out, so that a hull made on an uninitialised map saves as it was spawned.
  - type: ContainerContainer
    containers:
      actions: !type:Container
  - type: KsCrewVehicleHorn
    sound:
      path: /Audio/Effects/Vehicle/carhorn.ogg
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 8
    energy: 2
  - type: KsCrewVehicleHeadlight
  - type: KsCrewVehicleRunOver
    damage:
      types:
        Blunt: 25
  # Breaks through windows, grilles and tables; crashes into walls. Doors are bumped open, never smashed.
  - type: KsCrewVehicleSmash
    smashable:
      tags:
      - Window
      components:
      - CanBuildWindowOnTop
      - Bonkable
    walls:
      tags:
      - Wall
    smashDamage:
      types:
        Blunt: 150
    smashSelfDamage:
      types:
        Blunt: 5
    wallDamage:
      types:
        Blunt: 30
    wallSelfDamage:
      types:
        Blunt: 20
  - type: KsCrewVehicleCrashLockout
