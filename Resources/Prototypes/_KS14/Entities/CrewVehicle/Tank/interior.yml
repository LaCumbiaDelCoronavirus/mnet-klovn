# The inside of the tank (Maps/_KS14/CrewVehicle/tank.yml and tank_empty.yml): its crew compartment, ahead of the engine
#   bay, round the turret ring. Its front is north. Its grid has floor three tiles by three; the walls round it are drawn
#   by the KsCrewVehicleInteriorChassisTank*Wall pieces, stop people with KsCrewVehicleInteriorWallTank and block sight
#   with a closed ring of KsCrewVehicleInteriorOccluderTank: there are no windows, and only the driver's seat looks out.

# Up front: drives, aims the turret and fires both guns, switching between them with one action.
- type: entity
  parent: KsCrewVehicleInteriorBaseSeat
  id: KsCrewVehicleSeatTankDriver
  categories: [ HideSpawnMenu ]
  name: driver's seat
  description: The controls, the gun sight and both triggers are within reach from here.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Humvee/interior.rsi
    state: car_seat
    drawdepth: Objects
  - type: KsCrewVehicleDriverSeat
  - type: KsCrewVehicleGunnerSeat
    mounts:
    - cannon
    - coax
    cycleWeapons: true
  # Looks out from the hull through the gun sight, zoomed out and leaning well toward the cursor.
  - type: KsCrewVehicleViewSeat
    pvsScale: 2.5
    zoom: 1.75,1.75
    cursorOffset: 4

# Beside the breech, where a loader sits; a gunner's seat of its own if the machine gun is ever given one.
- type: entity
  parent: KsCrewVehicleInteriorBaseSeat
  id: KsCrewVehicleSeatTankCrew
  categories: [ HideSpawnMenu ]
  name: crew seat
  description: A folding seat beside the breech.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Humvee/interior.rsi
    state: car_seat
    drawdepth: Objects

- type: entity
  parent: KsCrewVehicleInteriorBaseSeat
  id: KsCrewVehicleSeatTankPassenger
  categories: [ HideSpawnMenu ]
  name: passenger seat
  description: A hard seat on the far side of the breech.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Humvee/interior.rsi
    state: car_seat
    drawdepth: Objects

# The cannon's breech, in the middle of the cabin: one shell at a time goes in here, and the one in it can be taken back
#   out.
- type: entity
  parent: KsCrewVehicleInteriorBaseAmmoPort
  id: KsCrewVehicleAmmoPortTankCannon
  categories: [ HideSpawnMenu ]
  name: breech
  description: The back end of the cannon. Load one shell at a time; check it to see what is in it.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _KS14/CrewVehicle/Tank/interior.rsi
    drawdepth: Objects
    layers:
    - state: prop4
    - state: prop4_emissive
      shader: unshaded
      map: [ "emissiveBreech" ]
  - type: EmissiveLayers
    layers:
    - emissiveBreech
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        hard: false
        layer:
        - MidImpassable
  - type: KsCrewVehicleAmmoPort
    mount: cannon
    loadDelay: 2.5
    canUnload: true

# Feeds the machine gun beside the cannon.
- type: entity
  parent: KsCrewVehicleInteriorBaseAmmoPort
  id: KsCrewVehicleAmmoPortTankMachineGun
  categories: [ HideSpawnMenu ]
  name: machine gun loader
  description: Feeds the machine gun beside the cannon. Hand it .30 rifle rounds, loose or boxed.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _KS14/CrewVehicle/Humvee/interior.rsi
    drawdepth: Objects
    layers:
    - state: weapons_loader
    - state: weapons_loader_emissive
      shader: unshaded
      map: [ "emissiveLoader" ]
  - type: EmissiveLayers
    layers:
    - emissiveLoader
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.4,0.2,0.4"
        hard: false
        layer:
        - MidImpassable
  - type: KsCrewVehicleAmmoPort
    mount: coax
    loadDelay: 3

# The hatch in the back wall, the bulkhead to the engine bay, drawn on the floor in front of it.
- type: entity
  parent: KsCrewVehicleInteriorBaseExit
  id: KsCrewVehicleExitDoorTank
  categories: [ HideSpawnMenu ]
  name: hatch
  description: The way out, at the back.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _KS14/CrewVehicle/Humvee/interior.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: exit_door
    # semi-unshaded: half lit by the room, half always on; only the unshaded half glows
    - state: exit_door_emissive
      color: '#FFFFFF80'
    - state: exit_door_emissive
      shader: unshaded
      color: '#FFFFFF80'
      map: [ "emissiveDoor" ]
  - type: EmissiveLayers
    layers:
    - emissiveDoor

# The walls are drawn by the floor plan: these only stop people.
- type: entity
  parent: KsCrewVehicleInteriorBaseWall
  id: KsCrewVehicleInteriorWallTank
  categories: [ HideSpawnMenu ]
  name: tank wall
  description: Armour plate, from the inside.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false

# The cabin's outline, for sight: placed at the grid's origin with a polygon each in the map file, a closed ring over the
#   walls with no gap anywhere.
- type: entity
  parent: KsCrewVehicleInteriorBaseOccluder
  id: KsCrewVehicleInteriorOccluderTank
  categories: [ HideSpawnMenu ]
  name: tank wall
  description: Armour plate, from the inside.

# A dim red lamp in the roof.
- type: entity
  parent: KsCrewVehicleInteriorBaseLight
  id: KsCrewVehicleInteriorDomeLightTank
  categories: [ HideSpawnMenu ]
  name: dome light
  description: A small red lamp in the roof of the cabin.
  components:
  - type: PointLight
    radius: 3
    energy: 0.5
    color: '#FF8060'

# The driver's instruments, a cold glow at the front of the cabin.
- type: entity
  parent: KsCrewVehicleInteriorBaseLight
  id: KsCrewVehicleInteriorConsoleLightTank
  categories: [ HideSpawnMenu ]
  name: console glow
  description: The driver's instruments, lit.
  components:
  - type: PointLight
    radius: 1.75
    energy: 0.3
    color: '#80B0C0'

# Over the hatch, so the way out shows in the dark.
- type: entity
  parent: KsCrewVehicleInteriorBaseLight
  id: KsCrewVehicleInteriorHatchLightTank
  categories: [ HideSpawnMenu ]
  name: hatch lamp
  description: A small red lamp over the hatch.
  components:
  - type: PointLight
    radius: 1.5
    energy: 0.3
    color: '#FF8060'

# The floor plan, placed at the grid's origin: the floor and the driver's instruments. Each layer is one tile, offset to its
#   place. Always drawn as the south-facing frames, however the eye turns. The walls round it are drawn by the three
#   KsCrewVehicleInteriorChassisTank*Wall pieces, as the art is meant to be seen from above and the south: the front and
#   back walls as faces, each a run of three tiles closed at both ends, and the side walls edge on.
- type: entity
  parent: KsCrewVehicleInteriorBaseDecoration
  id: KsCrewVehicleInteriorChassisTank
  categories: [ HideSpawnMenu ]
  name: tank floor
  description: The inside of a tank.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Tank/interior.rsi
    enableOverrideDir: true
    overrideDir: South
    layers:
    # Floor, x 0 to 2, y 0 to 2; the row against the back wall has a kick plate.
    - state: prop1
      offset: 0.5,0.5
    - state: prop1
      offset: 1.5,0.5
    - state: prop1
      offset: 2.5,0.5
    - state: prop3
      offset: 0.5,1.5
    - state: prop3
      offset: 1.5,1.5
    - state: prop3
      offset: 2.5,1.5
    - state: prop3
      offset: 0.5,2.5
    - state: prop3
      offset: 1.5,2.5
    - state: prop3
      offset: 2.5,2.5
    # The driver's instruments, left of the seat, against the front wall.
    - state: prop0
      offset: 0.5,2.5
    - state: prop0_emissive
      shader: unshaded
      offset: 0.5,2.5
      map: [ "emissiveProp0" ]
  - type: EmissiveLayers
    layers:
    - emissiveProp0

# The front wall, with the vision blocks on the left, and the bulkhead to the engine bay at the back: faces, their north
#   frames, each a run of three closed at both ends. The faces leave their top four pixels clear, so the back wall is
#   raised by that much to meet the floor.
- type: entity
  parent: KsCrewVehicleInteriorBaseDecoration
  id: KsCrewVehicleInteriorChassisTankEndWalls
  categories: [ HideSpawnMenu ]
  name: tank wall
  description: Armour plate, from the inside.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Tank/interior.rsi
    enableOverrideDir: true
    overrideDir: North
    layers:
    - state: tank_front_3
      offset: 0.5,3.5
    - state: tank_front_2
      offset: 1.5,3.5
    - state: trank_front_1
      offset: 2.5,3.5
    - state: tank_back_1
      offset: 0.5,-0.375
    - state: tank_back_2
      offset: 1.5,-0.375
    - state: tank_back_3
      offset: 2.5,-0.375

# The left wall, edge on: its east frames, a strip at the tile's east edge, moved in by its width to lie along the floor's
#   edge under the ends of the front and back walls.
- type: entity
  parent: KsCrewVehicleInteriorBaseDecoration
  id: KsCrewVehicleInteriorChassisTankLeftWall
  categories: [ HideSpawnMenu ]
  name: tank wall
  description: Armour plate, from the inside.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Tank/interior.rsi
    enableOverrideDir: true
    overrideDir: East
    layers:
    - state: tank_left_1
      offset: -0.375,0.5
    - state: tank_left_2
      offset: -0.375,1.5
    - state: tank_left_3
      offset: -0.375,2.5

# The right wall, edge on: its west frames, moved in the same way.
- type: entity
  parent: KsCrewVehicleInteriorBaseDecoration
  id: KsCrewVehicleInteriorChassisTankRightWall
  categories: [ HideSpawnMenu ]
  name: tank wall
  description: Armour plate, from the inside.
  components:
  - type: Sprite
    sprite: _KS14/CrewVehicle/Tank/interior.rsi
    enableOverrideDir: true
    overrideDir: West
    layers:
    - state: tank_right_1
      offset: 3.375,0.5
    - state: tank_right_2
      offset: 3.375,1.5
    - state: tank_right_3
      offset: 3.375,2.5
